worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Preserve X-Forwarded-Proto from an outer reverse proxy (e.g., Caddy),
    # falling back to $scheme when accessed directly.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
        http    http;
    }

    upstream firmware {
        server firmware:3001;
    }

    upstream configs {
        server configs:3002;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://queue.simpleanalyticscdn.com; connect-src 'self' blob: https://queue.simpleanalyticscdn.com; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Firmware API — rewrite to strip /firmware prefix
        location /api/firmware/ {
            rewrite ^/api/firmware/(.*)$ /api/$1 break;
            proxy_pass http://firmware;
            proxy_redirect http:// $forwarded_proto://;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # SSE support for build log streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            add_header X-Accel-Buffering no;
        }

        # Configs API (no trailing slash — frontend calls /api/configs without one)
        location /api/configs {
            proxy_pass http://configs;
            proxy_redirect http:// $forwarded_proto://;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Auth routes
        location /api/auth {
            proxy_pass http://configs;
            proxy_redirect http:// $forwarded_proto://;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Shared config routes
        location /api/shared {
            proxy_pass http://configs;
            proxy_redirect http:// $forwarded_proto://;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Hashed assets — long cache
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Data JSON files — short cache
        location /data/ {
            expires 1h;
            add_header Cache-Control "public";
        }

        # PCB designer SPA
        location /pcb-designer {
            alias /usr/share/nginx/html/pcb-designer;
            try_files $uri $uri/ /pcb-designer/index.html;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
