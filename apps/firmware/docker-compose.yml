services:
  firmware-server:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - klipper-source:/data/klipper
      - firmware-db:/data/db
      - ../../data:/data/board-data:ro
      - ../../data/firmware-presets:/data/firmware-presets:ro
    environment:
      PORT: 3001
      KLIPPER_SOURCE_PATH: /data/klipper
      DB_PATH: /data/db/firmware.sqlite
      BOARD_DATA_PATH: /data/board-data
      PRESET_DATA_PATH: /data/firmware-presets
      BUILDER_IMAGE: klipperforge-builder:latest
      MAX_CONCURRENT_BUILDS: 2
      MAX_PENDING_BUILDS: 20
      BUILD_TIMEOUT_MS: 120000
      RATE_LIMIT_MAX_REQUESTS: 5
      RATE_LIMIT_WINDOW_SECONDS: 60

volumes:
  klipper-source:
  firmware-db:
