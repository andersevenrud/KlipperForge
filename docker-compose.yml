name: klipperforge

services:
  # One-time init: clones Klipper source into the volume if empty
  klipper-init:
    image: alpine/git:latest
    volumes:
      - klipper-source:/data/klipper
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -d /data/klipper/.git ]; then
          echo "Cloning Klipper source..."
          git clone --depth=1 https://github.com/Klipper3d/klipper.git /data/klipper
        else
          echo "Klipper source already present, skipping clone"
        fi
    restart: "no"

  # Nightly Klipper source update (3 AM UTC)
  klipper-updater:
    image: alpine/git:latest
    volumes:
      - klipper-source:/data/klipper
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "0 3 * * * cd /data/klipper && git fetch --depth=1 origin && git reset --hard origin/master && echo \"[\$(date)] Klipper updated\"" \
          | crontab -
        crond -f -l 2
    depends_on:
      klipper-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-time init: builds the firmware builder image if missing
  builder-init:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./apps/firmware/docker:/docker:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if ! docker image inspect klipperforge-builder:latest >/dev/null 2>&1; then
          echo "Building klipperforge-builder image..."
          docker build -t klipperforge-builder:latest -f /docker/builder.Dockerfile /docker
        else
          echo "klipperforge-builder image already exists, skipping build"
        fi
    restart: "no"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      firmware:
        condition: service_healthy
      configs:
        condition: service_healthy
    restart: unless-stopped

  firmware:
    build:
      context: .
      dockerfile: apps/firmware/Dockerfile
    depends_on:
      klipper-init:
        condition: service_completed_successfully
      builder-init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - klipper-source:/data/klipper:ro
      - firmware-builds:/data/builds
      - firmware-db:/data/db
      - ./data:/data/board-data:ro
      - ./data/firmware-presets:/data/firmware-presets:ro
    environment:
      PORT: 3001
      TRUST_PROXY: "true"
      KLIPPER_SOURCE_PATH: /data/klipper
      DB_PATH: /data/db/firmware.sqlite
      BOARD_DATA_PATH: /data/board-data
      PRESET_DATA_PATH: /data/firmware-presets
      BUILDER_IMAGE: klipperforge-builder:latest
      KLIPPER_VOLUME_NAME: klipperforge_klipper-source
      BUILDS_VOLUME_NAME: klipperforge_firmware-builds
      BUILDS_PATH: /data/builds
      MAX_CONCURRENT_BUILDS: ${MAX_CONCURRENT_BUILDS:-2}
      MAX_PENDING_BUILDS: ${MAX_PENDING_BUILDS:-20}
      BUILD_TIMEOUT_MS: ${BUILD_TIMEOUT_MS:-120000}
      RATE_LIMIT_MAX_REQUESTS: ${FIRMWARE_RATE_LIMIT_MAX_REQUESTS:-5}
      RATE_LIMIT_WINDOW_SECONDS: ${FIRMWARE_RATE_LIMIT_WINDOW_SECONDS:-60}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-500}
      CACHE_MAX_SIZE_MB: ${CACHE_MAX_SIZE_MB:-200}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-604800}
      CACHE_EVICT_STALE_COMMITS: ${CACHE_EVICT_STALE_COMMITS:-true}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  configs:
    build:
      context: .
      dockerfile: apps/configs/Dockerfile
    volumes:
      - configs-db:/data/db
    environment:
      PORT: 3002
      TRUST_PROXY: "true"
      DB_PATH: /data/db/configs.sqlite
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost/api/auth/github/callback}
      APP_URL: ${APP_URL:-http://localhost}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-30}
      RATE_LIMIT_MAX_REQUESTS: ${CONFIGS_RATE_LIMIT_MAX_REQUESTS:-30}
      RATE_LIMIT_WINDOW_SECONDS: ${CONFIGS_RATE_LIMIT_WINDOW_SECONDS:-60}
      MAX_CONFIGS_PER_USER: ${MAX_CONFIGS_PER_USER:-50}
      MAX_REVISIONS_PER_CONFIG: ${MAX_REVISIONS_PER_CONFIG:-100}
      MAX_DOCUMENT_SIZE_BYTES: ${MAX_DOCUMENT_SIZE_BYTES:-65536}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3002/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  klipper-source:
  firmware-builds:
  firmware-db:
  configs-db:
